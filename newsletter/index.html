---
layout: base
---
<div class="relative bg-gray-50 overflow-hidden">
  <div class="relative pt-6 pb-12 sm:pb-16 md:pb-20 lg:pb-28 xl:pb-32">
    <main class="mt-10 mx-auto max-w-screen-xl px-4 sm:mt-12 sm:px-6 md:mt-16 lg:mt-20 xl:mt-28">
      <div class="text-center">
        <h2 class="text-4xl tracking-tight leading-10 font-extrabold text-gray-900 sm:text-5xl sm:leading-none md:text-6xl">
          Get the sqlc.dev newsletter in your inbox
        </h2>
        <form
          class="mt-5 max-w-md mx-auto sm:flex sm:justify-center md:mt-8"
          action="https://buttondown.email/api/emails/embed-subscribe/sqlc"
          method="post"
          target="popupwindow"
          onsubmit="window.open('https://buttondown.email/sqlc', 'popupwindow')"
          class="embeddable-buttondown-form"
        >
          <div class="rounded-md shadow">
            <input name="email" type="email" id="bd-email" placeholder="Your email" class="w-full flex items-center justify-center px-8 py-3 border border-transparent text-base leading-6 font-medium rounded-md text-indigo-600 bg-white hover:text-indigo-500 focus:outline-none focus:border-indigo-300 focus:shadow-outline-indigo transition duration-150 ease-in-out md:py-4 md:text-lg md:px-10"/>
          </div>
          <div class="mt-3 rounded-md shadow sm:mt-0 sm:ml-3">
            <input type="submit" value="Subscribe" class="w-full flex items-center justify-center px-8 py-3 border border-transparent text-base leading-6 font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:border-indigo-700 focus:shadow-outline-indigo transition duration-150 ease-in-out md:py-4 md:text-lg md:px-10" />
          </div>
        </form>
        <div class="mt-3 max-w-md mx-auto text-gray-500 md:mt-5 md:max-w-3xl">By clicking "Subscribe," you consent to allow Riza to store and process the personal information submitted above to provide you the content requested.
        </div>
      </div>
    </main>
  </div>
</div>
